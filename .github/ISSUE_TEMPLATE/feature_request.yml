name: Feature request
description: Suggest a fee type, condition, report or storefront improvement.
labels: [ enhancement ]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Who needs this (merchant, buyer, developer) and what can't they do today? If a Magento fee module does it, say which.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What you'd like
      description: How it should work. If you know the Commerce API, webhook or event it needs, mention it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to open a pull request for this.
